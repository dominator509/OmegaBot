name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omegabot
          POSTGRES_PASSWORD: omegabot
          POSTGRES_DB: omegabot_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omegabot -d omegabot_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable package manager
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm run build

      - name: Smoke test with Postgres
        run: corepack pnpm run smoke
        env:
          DATABASE_URL: postgres://omegabot:omegabot@127.0.0.1:5432/omegabot_smoke
